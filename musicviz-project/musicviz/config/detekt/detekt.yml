# Tuned detekt config (see app/build.gradle.kts for the reasoning).
style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false # ktlint owns line length

naming:
  FunctionNaming:
    ignoreAnnotated: ["Composable"]

complexity:
  # Thresholds sit just above the worst measured value so the gate cannot
  # regress. Lower each one in the commit that shrinks its worst offender.
  LongMethod:
    active: true
    threshold: 320
  LongParameterList:
    active: true
    functionThreshold: 20
    constructorThreshold: 20
    ignoreDefaultParameters: true
  CyclomaticComplexMethod:
    active: true
    threshold: 85
  TooManyFunctions:
    active: true
    thresholdInFiles: 200
    thresholdInClasses: 200
    thresholdInInterfaces: 200
    thresholdInObjects: 200
    thresholdInEnums: 200
    ignorePrivate: true
    ignoreOverridden: true
  LargeClass:
    active: true
    threshold: 1100
    # Pure data catalogs: long by nature, no logic to decompose.
    excludes:
      - '**/ThemePackCatalog.kt'
      - '**/VisualStyleCatalog.kt'
      - '**/BuiltInPresets.kt'

potential-bugs:
  active: true

exceptions:
  active: true

coroutines:
  active: true
