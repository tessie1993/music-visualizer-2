name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: musicviz-project/musicviz

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint + bundled-notices freshness
        run: ./gradlew ktlintCheck checkThirdPartyNotices --stacktrace

      - name: Unit tests (incl. Robolectric UI tests)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Exercises R8/resource shrinking on every push so a broken keep rule is
      # caught here rather than at upload time. Unsigned unless the signing
      # secrets are present.
      - name: Bundle release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Check native libs for 16 KB page alignment
        working-directory: musicviz-project/musicviz/app/src/main/jniLibs
        run: |
          set -uo pipefail
          # Play requires 16 KB page-size support for targetSdk 35+. Warn here;
          # release.yml turns the same check into a hard gate.
          bad=0
          for so in $(find . -name '*.so'); do
            aligns=$(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }')
            for a in $aligns; do
              if [ "$((a))" -lt 16384 ]; then
                echo "::warning file=$so::LOAD segment aligned to $a, needs >= 0x4000 (16384). Rebuild via the native-libs workflow."
                bad=1
                break
              fi
            done
          done
          [ "$bad" -eq 0 ] && echo "All native libs are 16 KB aligned."
          exit 0

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: musicviz-debug-apk
          path: musicviz-project/musicviz/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish APK to apk-drop branch
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: musicviz-project/musicviz/app/build/outputs/apk/debug
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -b apk-drop
          git config user.email noreply@anthropic.com
          git config user.name Claude
          git add app-debug.apk
          git commit -m "MusicViz debug APK from ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-drop

      - name: Upload test & lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            musicviz-project/musicviz/app/build/reports/
          retention-days: 7
