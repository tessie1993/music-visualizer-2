name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: musicviz-project/musicviz

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Unit tests (incl. Robolectric UI tests)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify debug APK
        working-directory: musicviz-project/musicviz/app/build/outputs/apk/debug
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK not found}}"
          BT="$SDK/build-tools/$(ls -1 "$SDK/build-tools" | sort -V | tail -n1)"
          echo "Using build-tools: $BT"

          APK=app-debug.apk
          test -s "$APK" || { echo "::error::$APK is missing or empty"; exit 1; }

          # Signature must verify, or the APK cannot be installed on a device.
          "$BT/apksigner" verify --verbose --print-certs "$APK"

          # Capture once and match against here-strings: piping into `head`/`grep -q`
          # closes the pipe early, which trips `pipefail` and fails the step.
          BADGING=$("$BT/aapt2" dump badging "$APK")
          ZIPLIST=$(unzip -l "$APK")
          head -5 <<<"$BADGING"

          grep -q "package: name='dev.musicviz'" <<<"$BADGING" \
            || { echo "::error::unexpected applicationId"; exit 1; }
          grep -q '^application-debuggable$' <<<"$BADGING" \
            || { echo "::error::APK is not debuggable — this is meant to be a debug build"; exit 1; }
          grep -q "native-code: 'arm64-v8a'" <<<"$BADGING" \
            || { echo "::error::arm64-v8a native code missing"; exit 1; }
          grep -q 'lib/arm64-v8a/libprojectM-4\.so' <<<"$ZIPLIST" \
            || { echo "::error::projectM native library missing from APK"; exit 1; }
          grep -q 'lib/arm64-v8a/libprojectmjni\.so' <<<"$ZIPLIST" \
            || { echo "::error::projectM JNI bridge missing from APK"; exit 1; }

          VNAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p;T;q" <<<"$BADGING")
          VCODE=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p;T;q" <<<"$BADGING")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(du -h "$APK" | cut -f1)

          {
            echo "### MusicViz debug APK"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Package | \`dev.musicviz\` (debuggable) |"
            echo "| Version | $VNAME ($VCODE) |"
            echo "| ABI | arm64-v8a |"
            echo "| Size | $SIZE |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: musicviz-debug-apk
          path: musicviz-project/musicviz/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish APK to apk-drop branch
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: musicviz-project/musicviz/app/build/outputs/apk/debug
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -b apk-drop
          git config user.email noreply@anthropic.com
          git config user.name Claude
          git add app-debug.apk
          git commit -m "MusicViz debug APK from ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-drop

      - name: Upload test & lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            musicviz-project/musicviz/app/build/reports/
          retention-days: 7
