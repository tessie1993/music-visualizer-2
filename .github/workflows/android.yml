name: Build MusicViz Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "musicviz-project/musicviz/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "musicviz-project/musicviz/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: musicviz-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: musicviz-project/musicviz
  APK_SOURCE: musicviz-project/musicviz/app/build/outputs/apk/debug/app-debug.apk

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Android SDK 36
        shell: bash
        # sdkmanager is not on PATH on the ubuntu-24.04 runner image; resolve
        # it from the preinstalled SDK location instead.
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK location not set on runner}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Assemble debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Package APK and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' \
            "$PROJECT_DIR/app/build.gradle.kts" | head -n 1)
          SHORT_SHA="${GITHUB_SHA::7}"
          FILE_NAME="MusicViz-${VERSION_NAME:-debug}-${SHORT_SHA}-debug.apk"

          mkdir -p dist
          cp "$APK_SOURCE" "dist/$FILE_NAME"
          sha256sum "dist/$FILE_NAME" > "dist/$FILE_NAME.sha256"

          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "Built dist/$FILE_NAME"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: musicviz-debug-${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/${{ steps.package.outputs.file_name }}
            dist/${{ steps.package.outputs.file_name }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # Verification runs after the APK upload. If a check fails, the APK is
      # still available from the workflow run for device testing.
      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Run Kotlin formatting checks
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew ktlintCheck --stacktrace --no-daemon

      - name: Upload reports when verification fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: musicviz-build-reports-${{ github.run_number }}
          path: |
            musicviz-project/musicviz/app/build/reports/
            musicviz-project/musicviz/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
