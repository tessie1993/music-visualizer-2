name: Play Store release

# Builds the signed Android App Bundle to upload to Play Console.
#
# Required repository secrets:
#   MUSICVIZ_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   MUSICVIZ_KEYSTORE_PASSWORD
#   MUSICVIZ_KEY_ALIAS
#   MUSICVIZ_KEY_PASSWORD
#
# Produce the first value with:  base64 -w0 musicviz-upload.jks

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: musicviz-project/musicviz

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # A release that fails Play's 16 KB page-size requirement is rejected at
      # upload, so fail here instead of after a review cycle.
      - name: Gate on 16 KB native alignment
        working-directory: musicviz-project/musicviz/app/src/main/jniLibs
        run: |
          set -euo pipefail
          fail=0
          for so in $(find . -name '*.so'); do
            for a in $(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }'); do
              if [ "$((a))" -lt 16384 ]; then
                echo "::error file=$so::LOAD segment aligned to $a; Play requires >= 16384. Run the native-libs workflow and commit the rebuilt .so."
                fail=1
              fi
            done
          done
          exit "$fail"

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICVIZ_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::MUSICVIZ_KEYSTORE_BASE64 secret is not set; cannot produce a signed bundle."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Verify (ktlint, tests, lint)
        run: ./gradlew ktlintCheck testDebugUnitTest lint --stacktrace

      - name: Build signed AAB
        env:
          MUSICVIZ_KEYSTORE: ${{ runner.temp }}/upload.jks
          MUSICVIZ_KEYSTORE_PASSWORD: ${{ secrets.MUSICVIZ_KEYSTORE_PASSWORD }}
          MUSICVIZ_KEY_ALIAS: ${{ secrets.MUSICVIZ_KEY_ALIAS }}
          MUSICVIZ_KEY_PASSWORD: ${{ secrets.MUSICVIZ_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Confirm the bundle is signed
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/release/app-release.aab
          unzip -l "$aab" | grep -q 'META-INF/.*\.RSA\|META-INF/.*\.EC' \
            || { echo "::error::$aab is not signed"; exit 1; }
          ls -l "$aab"

      - name: Upload AAB and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: musicviz-release-bundle
          # The mapping file must be uploaded to Play Console alongside the
          # bundle, otherwise crash traces stay obfuscated.
          path: |
            musicviz-project/musicviz/app/build/outputs/bundle/release/app-release.aab
            musicviz-project/musicviz/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
